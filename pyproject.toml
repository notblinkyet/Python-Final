[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "ValutaTrade Hub — консольная платформа для отслеживания и симуляции торговли фиатными и криптовалютами"
authors = [
    { name = "Yaroslav", email = "sneakerya@yandex.ru" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.10",
    "requests>=2.32",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.8,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
history_file = "exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3
